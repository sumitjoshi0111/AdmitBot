<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AdmitBot</title>

<!-- Bootstrap CSS (CDN) -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<div class="container py-4">

  <div class="text-center mb-3">
    <h1 class="fw-bold">AdmitBot</h1>
    <p class="text-muted">AI-Based College Admission Counselling Assistant</p>
    <small class="text-secondary">
      Uses sample demonstration cutoff data — not official CAP/DTE data.
    </small>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">

      <div id="chat-box" class="chat-box mb-3"></div>

      <div id="suggested-questions" class="mb-3 d-flex flex-wrap gap-2">
        <button class="btn btn-outline-primary btn-sm suggestion-btn">What is CAP?</button>
        <button class="btn btn-outline-primary btn-sm suggestion-btn">What is DSE?</button>
        <button class="btn btn-outline-primary btn-sm suggestion-btn">How does college prediction work?</button>
        <button class="btn btn-outline-primary btn-sm suggestion-btn">I want counselling</button>
      </div>

      <div class="input-group">
        <input
          type="text"
          id="user-input"
          class="form-control"
          placeholder="Type your message... (e.g., My rank is 2500)"
          autocomplete="off"
        />
        <button id="send-btn" class="btn btn-primary">Send</button>
        <button id="clear-btn" class="btn btn-outline-danger">Clear Chat</button>
      </div>

    </div>
  </div>

  <div class="text-center mt-3">
    <a href="PLACEHOLDER_ADMITPRO_URL" target="_blank" class="btn btn-link">
      &larr; Back to AdmitPro
    </a>
  </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
